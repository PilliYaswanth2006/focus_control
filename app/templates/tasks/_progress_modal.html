<!-- Reusable Progress Entry Modal (Add & Edit) -->
<div class="modal fade" id="fc-progress-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="fc-progress-form" method="post" action="" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="fc-progress-modal-title">Record Task Progress</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2 small fw-semibold" id="fc-progress-item-label" style="color: var(--task-accent);"></div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label small fw-semibold">
                                Quantity Completed (<span id="fc-progress-unit-label">units</span>)
                            </label>
                            <input type="number" step="0.01" min="0" name="quantity_completed" id="fc-progress-qty" class="form-control" value="0" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small fw-semibold">Time Spent (minutes)</label>
                            <input type="number" step="1" min="0" max="10080" name="time_spent_minutes" id="fc-progress-mins" class="form-control" value="0" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-7">
                            <label class="form-label small fw-semibold">Entry Date &amp; Time (Local)</label>
                            <input type="datetime-local" name="entry_timestamp" id="fc-progress-ts" class="form-control">
                            <div class="form-text small">Leave blank for current time (when adding).</div>
                        </div>
                        <div class="col-sm-5">
                            <label class="form-label small fw-semibold">Source</label>
                            <select name="update_source" id="fc-progress-source" class="form-select">
                                <option value="manual">Manual</option>
                                <option value="quick_log">Quick Log</option>
                                <option value="timer">Timer</option>
                                <option value="adjustment">Adjustment</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-semibold">Comments / Work Notes</label>
                        <textarea name="comments" id="fc-progress-comments" class="form-control" rows="2" maxlength="2000" placeholder="What was accomplished?"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="fc-progress-submit-btn">Save Progress</button>
                </div>
            </form>
        </div>
    </div>
</div>
